name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup pnpm (version is taken from package.json: "packageManager")
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm -r build

      - name: Ensure reflect-metadata is available for the BFF
        run: pnpm --filter ./apps/bff... exec node -e "require.resolve('reflect-metadata')"

      - name: Verify health controller routes exist (static check)
        run: |
          grep -REn "Get\\((\"|')/health\\1\\)" apps/bff/src || (echo "missing /health" && exit 1)
          grep -REn "Get\\((\"|')/readyz\\1\\)" apps/bff/src || (echo "missing /readyz" && exit 1)
