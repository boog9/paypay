name: Codex Autofix on PR Comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-autofix-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  run:
    if: >
      ${{
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@codex fix') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Fetch PR metadata
        id: meta
        uses: actions/github-script@v7
        with:
          script: |
            const prnum = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prnum
            });
            core.setOutput('pr', prnum.toString());
            core.setOutput('headRef', pr.head.ref);
            core.setOutput('baseRef', pr.base.ref);
            core.setOutput('sameRepo', (pr.head.repo.full_name === pr.base.repo.full_name) ? 'true' : 'false');

      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.meta.outputs.pr }}/head
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm -w install --frozen-lockfile

      - name: Run Codex
        id: codex
        uses: openai/codex-action@main
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          safety_strategy: drop_sudo
          prompt: |
            You are an autofix agent working inside a GitHub PR.
            Goals:
            - Implement tenant-wide BTCPay API key rotation when key reuse is enabled:
              update ALL sibling stores referencing the shared key in a single transaction;
              keep ForbiddenException for merchant-managed credentials; preserve createAdditionalStore() semantics.
            - Add/adjust tests to cover invoice/webhook flows for every affected store.
            Constraints: only necessary changes; keep existing tools.
            Extra instructions from the PR comment:
            ${{ github.event.comment.body }}
            After edits: run 'pnpm -r lint && pnpm -r test' and report results.

      - name: Commit changes (if any)
        id: commit
        run: |
          git config user.name  "codex-bot"
          git config user.email "bot@example.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "codex: tenant-wide BTCPay key rotation + tests (autofix)"
            echo "committed=true" >> $GITHUB_OUTPUT
          else
            echo "committed=false" >> $GITHUB_OUTPUT
          fi

      - name: Push back to PR branch (same-repo PR)
        if: steps.commit.outputs.committed == 'true' && steps.meta.outputs.sameRepo == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ steps.meta.outputs.headRef }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:${HEAD_REF}

      - name: Create PR with fixes (forked PR)
        if: steps.commit.outputs.committed == 'true' && steps.meta.outputs.sameRepo != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CODEX_AUTOFIX_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "codex: tenant-wide BTCPay key rotation + tests (autofix)"
          branch: codex/autofix-pr-${{ steps.meta.outputs.pr }}
          title: "Codex autofix for PR #${{ steps.meta.outputs.pr }}"
          body: |
            Codex autofixes for #${{ steps.meta.outputs.pr }} (fork PR, cannot push to source).

      - name: Post result as comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number("${{ steps.meta.outputs.pr }}");
            const msg = `Codex finished. See job logs for details.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: msg
            });
