services:
  frontend:
    build:
      context: ../../
      dockerfile: apps/frontend/Dockerfile
    image: ghcr.io/paypay/frontend:latest
    restart: unless-stopped
    env_file:
      - ../../infra/env/.env
    environment:
      - NEXT_PUBLIC_BFF_URL
      - NEXT_PUBLIC_API_BASE
      - HOSTNAME=0.0.0.0
      - PORT=3000
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/health',{cache:'no-store'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 12
    networks:
      - paynet

  bff:
    build:
      context: ../..
      dockerfile: apps/bff/Dockerfile
    image: ghcr.io/paypay/bff:latest
    pull_policy: build
    restart: unless-stopped
    env_file:
      - ../../infra/env/.env
    environment:
      - NODE_ENV
      - PORT
      - TRUST_PROXY
      - FRONTEND_ORIGIN
      - COOKIE_SECRET
      - JWT_ACCESS_TOKEN_SECRET
      - JWT_REFRESH_TOKEN_SECRET
      - BTCPAY_SERVER_URL
      - BTCPAY_ADMIN_API_KEY
      - BTCPAY_WEBHOOK_URL
      - BTCPAY_MASTER_KEY
      - BTCPAY_HEALTH_STORE_ID
      - BTCPAY_HEALTH_API_KEY
      - DATABASE_URL
      - POSTGRES_HOST
      - POSTGRES_PORT
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SMTP_FROM_EMAIL
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - paynet

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ../../infra/env/.env
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks:
      - paynet
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../../infra/env/.env
    environment:
      POSTGRES_DB: paypay
      POSTGRES_USER: paypay
      POSTGRES_PASSWORD: paypay
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - paynet
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paypay']
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ../../infra/env/.env
    environment:
      - CADDY_ADMIN_EMAIL
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      bff:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - paynet
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost/healthz || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  paynet:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  caddy-data:
  caddy-config:
